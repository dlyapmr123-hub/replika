<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>РЕПЛИКА — Магазин одежды</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0c;
    --surface: #16161a;
    --surface-2: #1e1e22;
    --border: #26262c;
    --text: #ffffff;
    --text-2: #888890;
    --text-3: #56565e;
    --gold: #d4b06a;
    --red: #ff4d6d;
    --orange: #ff9a3d;
    --green: #4ecdc4;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body { overflow-y: auto; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0a0a0c; }
  ::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 10px; border: 2px solid #0a0a0c; }
  ::-webkit-scrollbar-thumb:hover { background: #e0e0e0; }
  * { scrollbar-width: thin; scrollbar-color: #ffffff #0a0a0c; }

  img { -webkit-user-drag: none; user-drag: none; user-select: none; -webkit-user-select: none; }

  .app { width: 100%; min-height: 100vh; margin: 0 auto; background: var(--bg); }
  .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }

  /* ШАПКА */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 10, 12, 0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 40px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    padding: 0;
  }
  .brand-logo { width: 38px; height: 38px; object-fit: cover; border-radius: 8px; display: block; }
  .brand-text { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
  .brand-text::after { content: "."; color: var(--gold); }

  .gender-nav { display: flex; gap: 8px; flex: 1; justify-content: center; }
  .gender-btn {
    padding: 10px 22px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    background: transparent;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .gender-btn:hover { color: #fff; border-color: var(--text-3); }
  .gender-btn.on { background: #fff; color: #0a0a0c; border-color: #fff; }

  .header-actions { display: flex; gap: 20px; align-items: center; }
  .header-action {
    background: none;
    border: none;
    color: var(--text-2);
    font-size: 20px;
    cursor: pointer;
    padding: 8px;
    transition: color 0.2s ease;
    font-family: inherit;
  }
  .header-action:hover { color: #fff; }

  .user-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }
  .user-btn:hover { border-color: var(--gold); }
  .user-btn.logged-in { background: rgba(212, 176, 106, 0.15); border-color: var(--gold); }

  /* БАННЕР */
  .banner { position: relative; height: 460px; overflow: hidden; display: flex; align-items: center; }
  .banner-bg {
    position: absolute;
    inset: 0;
    background-image: url('main.jpg');
    background-size: cover;
    background-position: center;
    filter: brightness(0.45) blur(2px);
    transform: scale(1.05);
  }
  .banner-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,10,12,0.3) 0%, rgba(10,10,12,0.6) 60%, rgba(10,10,12,1) 100%);
  }
  .banner-content { position: relative; z-index: 2; max-width: 1400px; margin: 0 auto; padding: 0 40px; width: 100%; }
  .banner-badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid var(--gold);
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
    background: rgba(10,10,12,0.3);
  }
  .banner h1 {
    font-size: 64px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -3px;
    color: #fff;
    margin-bottom: 16px;
    max-width: 700px;
  }
  .banner h1 em { font-style: normal; color: var(--text-2); }
  .banner p { font-size: 15px; color: #c8c8d0; line-height: 1.6; max-width: 460px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }

  /* ФИЛЬТРЫ */
  .filters-section { padding: 40px 0 20px; border-top: 1px solid var(--border); }
  .filters-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .filters-title { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
  .filters-count { font-size: 13px; color: var(--text-2); }

  .filters-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; }
  .filter {
    padding: 10px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.25s ease;
    font-family: inherit;
  }
  .filter:hover { border-color: var(--text-3); }
  .filter.on { background: #fff; color: #0a0a0c; border-color: #fff; }

  .sort-menu { position: relative; flex-shrink: 0; }
  .sort-btn {
    padding: 10px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.2s ease;
  }
  .sort-btn:hover { border-color: var(--gold); }
  .sort-arrow { font-size: 10px; color: var(--gold); transition: transform 0.25s ease; }
  .sort-menu.open .sort-arrow { transform: rotate(180deg); }

  .sort-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px;
    min-width: 200px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-8px);
    transition: all 0.25s ease;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }
  .sort-menu.open .sort-dropdown { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .sort-dropdown button {
    display: block;
    width: 100%;
    padding: 10px 14px;
    background: none;
    border: none;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    border-radius: 10px;
    font-family: inherit;
    transition: all 0.15s ease;
  }
  .sort-dropdown button:hover { background: var(--surface-2); color: #fff; }
  .sort-dropdown button.active { color: var(--gold); background: rgba(212,176,106,0.08); }

  /* СЕТКА */
  .grid-section { padding: 20px 0 80px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }

  .card {
    cursor: pointer;
    transition: transform 0.3s ease;
    animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardAppear {
    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .card:hover { transform: translateY(-4px); }

  .card-img {
    aspect-ratio: 3/4;
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
  .card:hover .card-img img { transform: scale(1.05); }

  /* Затемнение и надпись при наведении для товаров под заказ */
  .card-preorder-overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 10, 12, 0.72);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: 3;
    pointer-events: none;
  }
  .card-preorder-overlay-text {
    color: var(--orange);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-align: center;
    padding: 0 16px;
    line-height: 1.4;
  }
  .card-preorder-overlay-text small {
    display: block;
    color: #fff;
    font-size: 11px;
    letter-spacing: 1.5px;
    font-weight: 600;
    margin-top: 8px;
    opacity: 0.85;
  }
  .card.preorder:hover .card-preorder-overlay { opacity: 1; }

  .tag {
    position: absolute;
    top: 12px;
    left: 12px;
    background: var(--gold);
    color: #0a0a0c;
    font-size: 10px;
    font-weight: 800;
    padding: 5px 10px;
    border-radius: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    z-index: 4;
  }
  .tag-preorder { background: var(--orange); }

  .fav {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 34px;
    height: 34px;
    background: rgba(10, 10, 12, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #fff;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 4;
    font-family: inherit;
  }
  .fav:hover { transform: scale(1.1); }
  .fav.on { color: var(--red); background: rgba(255, 77, 109, 0.25); }

  .card-name { font-size: 14px; font-weight: 500; color: #e8e8ea; margin-bottom: 6px; line-height: 1.3; }
  .card-price { font-size: 16px; font-weight: 700; color: #fff; }
  .card-price .old { font-size: 13px; color: var(--text-3); text-decoration: line-through; font-weight: 400; margin-left: 8px; }

  /* ПОДВАЛ */
  .footer {
    padding: 40px 0;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-3);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  /* МОБИЛЬНЫЙ ТАББАР */
  .mobile-tabbar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(10, 10, 12, 0.95);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 10px 0 14px;
    z-index: 200;
    justify-content: space-around;
  }
  .mobile-tab {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    padding: 4px 12px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    position: relative;
  }
  .mobile-tab.on { color: #fff; }
  .mobile-tab.on::before {
    content: "";
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 18px;
    height: 2px;
    background: var(--gold);
    border-radius: 2px;
  }
  .mobile-tab-icon { font-size: 20px; line-height: 1; }

  /* МОДАЛЬНЫЕ ОКНА */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal.active { opacity: 1; pointer-events: auto; }

  .modal-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 24px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
    transform: translateY(20px);
    transition: transform 0.3s ease;
    scrollbar-width: none;
  }
  .modal-card::-webkit-scrollbar { display: none; }
  .modal.active .modal-card { transform: translateY(0); }

  .modal-wide .modal-card { max-width: 700px; }
  .modal-product .modal-card { max-width: 1100px; padding: 0; overflow: hidden; max-height: 92vh; }

  .product-grid-modal { display: grid; grid-template-columns: 1.1fr 1fr; min-height: 600px; }
  .product-photo { background: var(--surface); position: relative; overflow: hidden; }

  .photo-gallery { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .photo-gallery-track { display: flex; height: 100%; transition: transform 0.4s ease; }
  .photo-gallery-track img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; display: block; }

  .photo-dots {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 3;
  }
  .photo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: all 0.2s ease;
    pointer-events: auto;
  }
  .photo-dot.on { background: #fff; width: 24px; border-radius: 4px; }

  .photo-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: rgba(10, 10, 12, 0.6);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 3;
    border: none;
    font-family: inherit;
    transition: background 0.2s ease;
    pointer-events: auto;
  }
  .photo-arrow:hover { background: rgba(10, 10, 12, 0.85); }
  .photo-arrow.prev { left: 12px; }
  .photo-arrow.next { right: 12px; }

  .product-details { padding: 40px; display: flex; flex-direction: column; overflow-y: auto; max-height: 92vh; }
  .product-details::-webkit-scrollbar { width: 0; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    background: rgba(10, 10, 12, 0.7);
    backdrop-filter: blur(10px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: inherit;
    z-index: 10;
    pointer-events: auto;
  }
  .modal-close:hover { background: rgba(10, 10, 12, 0.9); }

  /* ФОРМЫ */
  .auth-title { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
  .auth-sub { font-size: 14px; color: var(--text-2); margin-bottom: 28px; line-height: 1.5; }

  .form-group { margin-bottom: 16px; }
  .form-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-2);
    font-weight: 700;
    margin-bottom: 8px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    font-size: 15px;
    color: #fff;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .form-input:focus { border-color: var(--gold); }
  .form-input::placeholder { color: var(--text-3); }

  .form-error {
    font-size: 12px;
    color: var(--red);
    padding: 10px 14px;
    background: rgba(255, 77, 109, 0.1);
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
  }
  .form-error.show { display: block; }

  .form-submit {
    width: 100%;
    padding: 17px;
    background: #fff;
    color: #0a0a0c;
    border: none;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-top: 8px;
    transition: all 0.2s ease;
  }
  .form-submit:hover { transform: translateY(-2px); }
  .form-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .form-submit-gold {
    background: linear-gradient(135deg, #d4b06a, #e8c98a);
    color: #0a0a0c;
  }

  .form-switch { text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-2); }
  .form-switch button {
    background: none;
    border: none;
    color: var(--gold);
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    padding: 0 4px;
  }
  .form-skip { text-align: center; margin-top: 20px; }
  .form-skip button {
    background: none;
    border: none;
    color: var(--text-3);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
    padding: 8px;
  }

  /* КАРТОЧКА ТОВАРА */
  .prod-brand { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .prod-name { font-size: 30px; font-weight: 700; color: #fff; letter-spacing: -1.2px; margin-bottom: 16px; line-height: 1.15; }
  .prod-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  .prod-price { font-size: 32px; font-weight: 800; color: #fff; letter-spacing: -1.4px; }
  .prod-old { font-size: 16px; color: var(--text-3); text-decoration: line-through; }

  .preorder-notice {
    background: rgba(255, 154, 61, 0.12);
    border: 1px solid rgba(255, 154, 61, 0.4);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .preorder-notice-icon { font-size: 20px; flex-shrink: 0; line-height: 1; }
  .preorder-notice-text { font-size: 12.5px; color: #ffd0a0; line-height: 1.5; }
  .preorder-notice-text strong { color: var(--orange); }

  .size-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-2); font-weight: 700; margin-bottom: 10px; }
  .size-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .size-btn {
    flex: 1;
    min-width: 50px;
    padding: 14px 0;
    text-align: center;
    background: var(--surface);
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .size-btn.on { background: #fff; color: #0a0a0c; border-color: #fff; }
  .prod-desc { font-size: 14px; color: var(--text-2); line-height: 1.6; padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }

  /* РЕКОМЕНДУЕМЫЕ */
  .recommended-section { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); }
  .recommended-title { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-2); font-weight: 700; margin-bottom: 18px; }
  .recommended-scroll {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding-bottom: 8px;
    margin: 0 -40px;
    padding-left: 40px;
    padding-right: 40px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .recommended-scroll::-webkit-scrollbar { display: none; }
  .recommended-card { flex: 0 0 180px; scroll-snap-align: start; cursor: pointer; transition: transform 0.25s ease; }
  .recommended-card:hover { transform: translateY(-3px); }
  .recommended-img { aspect-ratio: 3/4; background: var(--surface); border-radius: 12px; overflow: hidden; margin-bottom: 10px; border: 1px solid var(--border); }
  .recommended-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .recommended-card:hover .recommended-img img { transform: scale(1.06); }
  .recommended-name { font-size: 12px; color: #e8e8ea; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
  .recommended-price { font-size: 13px; font-weight: 700; color: var(--gold); }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: #0a0a0c;
    padding: 14px 24px;
    border-radius: 100px;
    font-size: 13px;

<script>
  /* ==================== КОНФИГУРАЦИЯ ==================== */
  const SUPABASE_URL = 'https://ejnuygaxiiqhkxmferts.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_Da_7jup1twR4NcjAoo-Rpg_xH-CbTVw';

  // EmailJS — твои ключи
  const EMAILJS_SERVICE_ID = 'service_44t8nno';
  const EMAILJS_TEMPLATE_BOOKING = 'template_0i5v79l';   // шаблон БРОНИРОВАНИЯ
  const EMAILJS_TEMPLATE_ORDER = 'template_o9bo7a9';     // шаблон ЗАКАЗА
  const EMAILJS_PUBLIC_KEY = 'GiLyXeyjm21AtdRa4';

  // Базовый URL для ссылок в письме (определяется автоматически)
  const SITE_URL = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');

  let sbClient = null;
  try {
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch (e) {
    console.error('Supabase init error:', e);
  }

  try {
    if (EMAILJS_PUBLIC_KEY && EMAILJS_PUBLIC_KEY !== 'xxxxxxxxxxxx') {
      emailjs.init(EMAILJS_PUBLIC_KEY);
      console.log('✓ EmailJS инициализирован');
    }
  } catch (e) {
    console.error('EmailJS init error:', e);
  }

  /* ==================== FALLBACK ТОВАРЫ ==================== */
  const FALLBACK_PRODUCTS = [
    { id: 1, brand: 'РЕПЛИКА', name: 'Джинсы прямые', price: 4990, old: null, tag: null, category: 'bottom', gender: 'male', in_stock: true, images: ['images/jis/5.jpg','images/jis/6.jpg'], sizes: ['28','30','32','34','36'], description: 'Плотный деним, прямой крой, средняя посадка.' },
    { id: 2, brand: 'РЕПЛИКА', name: 'Джинсы slim', price: 5290, old: 6990, tag: '-25%', category: 'bottom', gender: 'female', in_stock: true, images: ['images/jis/6.jpg','images/jis/5.jpg'], sizes: ['28','30','32','34'], description: 'Зауженный крой, эластан, комфортная посадка.' },
    { id: 3, brand: 'РЕПЛИКА', name: 'Куртка кожаная', price: 24900, old: 32000, tag: '-20%', category: 'outerwear', gender: 'unisex', in_stock: true, images: ['images/kr/1.jpg','images/kr/2.jpg'], sizes: ['S','M','L','XL'], description: 'Натуральная кожа, металлическая фурнитура.' },
    { id: 4, brand: 'РЕПЛИКА', name: 'Куртка демисезонная', price: 14900, old: null, tag: 'NEW', category: 'outerwear', gender: 'male', in_stock: false, images: ['images/kr/2.jpg','images/kr/1.jpg'], sizes: ['S','M','L','XL'], description: 'Ветрозащитная, с утеплителем, капюшон.' },
    { id: 5, brand: 'РЕПЛИКА', name: 'Кроссовки белые', price: 8900, old: null, tag: null, category: 'shoes', gender: 'unisex', in_stock: true, images: ['images/ob/3.jpg','images/ob/4.jpg'], sizes: ['38','39','40','41','42'], description: 'Натуральная кожа, резиновая подошва.' },
    { id: 6, brand: 'РЕПЛИКА', name: 'Кроссовки тёмные', price: 9900, old: 12900, tag: '-25%', category: 'shoes', gender: 'female', in_stock: false, images: ['images/ob/4.jpg','images/ob/3.jpg'], sizes: ['38','39','40','41','42','43'], description: 'Натуральная кожа, мягкая амортизация.' }
  ];

  let products = FALLBACK_PRODUCTS;
  let state = {
    favorites: new Map(),
    currentProduct: null,
    currentPhotoIndex: 0,
    selectedSize: null,
    user: null,
    orders: [],
    authMode: 'login',
    filter: 'all',
    gender: 'all',
    sort: 'default',
  };

  /* ==================== ЛОАДЕР ==================== */
  function setLoaderProgress(p) {
    const fill = document.getElementById('loader-fill');
    if (fill) fill.style.width = p + '%';
  }

  function runLoader() {
    return new Promise((resolve) => {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 15 + 5;
        if (progress >= 100) {
          progress = 100;
          setLoaderProgress(100);
          clearInterval(interval);
          setTimeout(resolve, 250);
        } else {
          setLoaderProgress(Math.floor(progress));
        }
      }, 100);
    });
  }

  /* ==================== ЗАГРУЗКА ТОВАРОВ ==================== */
  async function loadProducts() {
    try {
      const response = await fetch('products.json?v=' + Date.now());
      if (!response.ok) throw new Error('Not found');
      const data = await response.json();
      if (data.products && Array.isArray(data.products)) {
        products = data.products.map(p => ({
          ...p,
          images: p.images || (p.image ? [p.image] : []),
          in_stock: p.in_stock !== false,
        }));
        console.log('✓ Загружено товаров:', products.length);
      }
    } catch (e) {
      console.log('✗ Используем встроенные товары:', e.message);
    }
  }

  /* ==================== АВТОРИЗАЦИЯ ==================== */
  async function checkAuth() {
    if (!sbClient) return;
    try {
      const { data } = await sbClient.auth.getSession();
      if (data && data.session) {
        state.user = data.session.user;
        await loadOrders();
      }
    } catch (e) {
      console.error('Auth check error:', e);
    }
  }

  function phoneToEmail(phone) {
    return phone.replace(/[^0-9]/g, '') + '@gmail.com';
  }

  async function signUp(phone, password) {
    const { data, error } = await sbClient.auth.signUp({
      email: phoneToEmail(phone),
      password: password,
      options: { data: { phone: phone } }
    });
    if (error) throw error;
    return data;
  }

  async function signIn(phone, password) {
    const { data, error } = await sbClient.auth.signInWithPassword({
      email: phoneToEmail(phone),
      password: password,
    });
    if (error) throw error;
    return data;
  }

  async function signOut() {
    if (!sbClient) return;
    await sbClient.auth.signOut();
    state.user = null;
    state.orders = [];
    showToast('Вы вышли из аккаунта');
    updateUserUI();
    closeProfile();
  }

  /* ==================== ЗАКАЗЫ ==================== */
  async function loadOrders() {
    if (!sbClient || !state.user) return;
    try {
      const { data, error } = await sbClient
        .from('orders')
        .select('*')
        .eq('user_id', state.user.id)
        .order('created_at', { ascending: false });
      if (error) throw error;
      state.orders = data || [];
    } catch (e) {
      console.error('Load orders error:', e);
      state.orders = [];
    }
  }

  async function createOrder(product, size, type) {
    if (!sbClient || !state.user) throw new Error('Not authenticated');

    const orderData = {
      user_id: state.user.id,
      product_name: product.name,
      product_price: product.price,
      product_size: size,
      product_image: (product.images && product.images[0]) || product.image,
      user_phone: state.user.user_metadata?.phone || state.user.email,
      status: type === 'booking' ? 'new' : 'confirmed'
    };

    const { data, error } = await sbClient.from('orders').insert([orderData]).select();
    if (error) throw error;
    await loadOrders();
    return data;
  }

  async function cancelOrder(orderId) {
    if (!sbClient || !state.user) return;
    if (!confirm('Отменить заказ?')) return;

    try {
      const { error } = await sbClient
        .from('orders')
        .delete()
        .eq('id', orderId)
        .eq('user_id', state.user.id);
      if (error) throw error;
      showToast('Заказ отменён');
      await loadOrders();
      renderProfile();
    } catch (e) {
      console.error('Cancel error:', e);
      showToast('Не удалось отменить');
    }
  }

  /* ==================== EMAILJS ==================== */
  async function sendEmail(product, size, type) {
    // type: 'booking' — бронь (в наличии), 'order' — заказ (под заказ)
    const templateId = type === 'booking' ? EMAILJS_TEMPLATE_BOOKING : EMAILJS_TEMPLATE_ORDER;

    if (!EMAILJS_SERVICE_ID || !templateId) {
      console.log('⚠️ EmailJS не настроен');
      return { success: false };
    }

    const phone = state.user?.user_metadata?.phone || 'Не указан';
    const now = new Date().toLocaleString('ru', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    const statusText = type === 'booking'
      ? 'Бронирование (в наличии)'
      : 'Заказ (под заказ)';

    const templateParams = {
      product_name: product.name,
      product_price: product.price.toLocaleString('ru'),
      product_size: size,
      user_phone: phone,
      order_time: now,
      order_status: statusText,
      product_url: SITE_URL + '?product=' + product.id,
    };

    try {
      const response = await emailjs.send(EMAILJS_SERVICE_ID, templateId, templateParams);
      console.log(`✓ Письмо (${type}) отправлено:`, response.status);
      return { success: true };
    } catch (error) {
      console.error(`✗ Ошибка отправки (${type}):`, error);
      return { success: false, reason: error.text || 'unknown' };
    }
  }

  /* ==================== ФИЛЬТРЫ ==================== */
  function setGender(gender) {
    state.gender = gender;
    document.querySelectorAll('.gender-btn').forEach(b => {
      b.classList.toggle('on', b.dataset.gender === gender);
    });
    renderGrid(true);
  }

  function applyFilter(cat) {
    state.filter = cat;
    document.querySelectorAll('.filter').forEach(f => {
      f.classList.toggle('on', f.dataset.cat === cat);
    });
    renderGrid(true);
  }

  function toggleSortMenu() {
    document.getElementById('sort-menu').classList.toggle('open');
  }

  function setSort(mode) {
    state.sort = mode;
    document.getElementById('sort-menu').classList.remove('open');
    const labels = { 'default': 'По умолчанию', 'price-asc': 'Дешевле', 'price-desc': 'Дороже' };
    document.getElementById('sort-label').textContent = labels[mode];
    document.querySelectorAll('#sort-dropdown button').forEach(b => {
      b.classList.toggle('active', b.textContent === labels[mode]);
    });
    renderGrid(true);
  }

  document.addEventListener('click', (e) => {
    const menu = document.getElementById('sort-menu');
    if (menu && !e.target.closest('#sort-menu')) menu.classList.remove('open');
  });

  /* ==================== РЕНДЕР СЕТКИ ==================== */
  function renderGrid(animate = false) {
    const el = document.getElementById('product-grid');
    const countEl = document.getElementById('catalog-count');
    if (!el) return;

    let filtered = [...products];
    if (state.filter !== 'all') filtered = filtered.filter(p => p.category === state.filter);
    if (state.gender !== 'all') filtered = filtered.filter(p => p.gender === state.gender || p.gender === 'unisex');
    if (state.sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
    else if (state.sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);

    if (countEl) countEl.textContent = `${filtered.length} ${plural(filtered.length, 'товар', 'товара', 'товаров')}`;

    if (filtered.length === 0) {
      el.innerHTML = `<div class="empty-state" style="grid-column: 1 / -1;"><div class="empty-icon">🔍</div><div class="empty-title">Ничего не найдено</div><div class="empty-text">Попробуйте другую категорию</div></div>`;
      return;
    }

    el.innerHTML = filtered.map((p, index) => {
      const isFav = state.favorites.has(p.id);
      const img = (p.images && p.images[0]) || p.image || '';
      const delay = animate ? (index * 0.05) : 0;
      const isPreorder = !p.in_stock;
      const topTag = isPreorder
        ? `<div class="tag tag-preorder">Под заказ</div>`
        : (p.tag ? `<div class="tag">${p.tag}</div>` : '');
      const preorderOverlay = isPreorder ? `
        <div class="card-preorder-overlay">
          <div class="card-preorder-overlay-text">
            ПОД ЗАКАЗ
            <small>Нажмите, чтобы заказать</small>
          </div>
        </div>
      ` : '';
      return `
        <div class="card ${isPreorder ? 'preorder' : ''}" onclick="openProduct(${p.id})" style="animation-delay: ${delay}s;">
          <div class="card-img">
            <img src="${img}" alt="${p.name}" loading="lazy" onerror="this.style.background='#242429';this.style.display='none';">
            ${preorderOverlay}
            ${topTag}
            <button class="fav ${isFav ? 'on' : ''}" data-fav-id="${p.id}" onclick="event.stopPropagation(); toggleFav(${p.id}, '${p.sizes[Math.floor(p.sizes.length/2)]}')">${isFav ? '♥' : '♡'}</button>
          </div>
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price.toLocaleString('ru')} ₽${p.old ? `<span class="old">${p.old.toLocaleString('ru')}</span>` : ''}</div>
        </div>
      `;
    }).join('');
  }

  /* ==================== КАРТОЧКА ТОВАРА ==================== */
  function openProduct(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    state.currentProduct = p;
    state.currentPhotoIndex = 0;
    state.selectedSize = p.sizes[Math.floor(p.sizes.length / 2)] || p.sizes[0];

    const isFav = state.favorites.has(p.id);
    const images = p.images && p.images.length ? p.images : (p.image ? [p.image] : ['']);
    const hasMultiple = images.length > 1;
    const recommended = products.filter(x => x.category === p.category && x.id !== p.id).slice(0, 8);

    const isPreorder = !p.in_stock;

    const preorderNotice = isPreorder ? `
      <div class="preorder-notice">
        <div class="preorder-notice-icon">⏳</div>
        <div class="preorder-notice-text">
          <strong>Товар под заказ.</strong> Сейчас нет в наличии, но мы доставим под заказ за 5–7 дней. Оформите заказ — мы свяжемся с вами.
        </div>
      </div>
    ` : '';

    const actionButton = isPreorder
      ? `<button class="form-submit form-submit-gold" onclick="handleAction('order')">Заказать</button>`
      : `<button class="form-submit" onclick="handleAction('booking')">Забронировать</button>`;

    const content = document.getElementById('product-content');

    content.innerHTML = `
      <button class="modal-close" onclick="closeProduct()" style="position: absolute;">×</button>
      <div class="product-grid-modal">
        <div class="product-photo">
          <div class="photo-gallery">
            <div class="photo-gallery-track" id="photo-track">
              ${images.map(img => `<img src="${img}" draggable="false" onerror="this.style.background='#242429';this.style.display='none';">`).join('')}
            </div>
            ${hasMultiple ? `
              <button class="photo-arrow prev" onclick="photoPrev()">‹</button>
              <button class="photo-arrow next" onclick="photoNext()">›</button>
              <div class="photo-dots" id="photo-dots">
                ${images.map((_, i) => `<div class="photo-dot ${i === 0 ? 'on' : ''}" onclick="photoGoTo(${i})"></div>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
        <div class="product-details">
          <div class="prod-brand">${p.brand}</div>
          <div class="prod-name">${p.name}</div>

          <div class="prod-price-row">
            <span class="prod-price">${p.price.toLocaleString('ru')} ₽</span>
            ${p.old ? `<span class="prod-old">${p.old.toLocaleString('ru')} ₽</span>` : ''}
          </div>

          ${preorderNotice}

          <div class="size-label">Размер</div>
          <div class="size-row" id="size-row">
            ${p.sizes.map(s => `<button class="size-btn ${s === state.selectedSize ? 'on' : ''}" onclick="selectSize('${s}')">${s}</button>`).join('')}
          </div>

          <div class="prod-desc">${p.description || ''}</div>

          ${actionButton}

          <div class="form-skip">
            <button onclick="toggleFav(${p.id}, '${state.selectedSize}'); syncProductFav(${p.id});" id="product-fav-btn">${isFav ? '♥ Убрать из избранного' : '♡ Добавить в избранное'}</button>
          </div>

          ${recommended.length > 0 ? `
            <div class="recommended-section">
              <div class="recommended-title">Похожие товары</div>
              <div class="recommended-scroll">
                ${recommended.map(r => {
                  const rImg = (r.images && r.images[0]) || r.image || '';
                  return `
                    <div class="recommended-card" onclick="event.stopPropagation(); switchProduct(${r.id})">
                      <div class="recommended-img">
                        <img src="${rImg}" draggable="false" onerror="this.style.background='#242429';this.style.display='none';">
                      </div>
                      <div class="recommended-name">${r.name}</div>
                      <div class="recommended-price">${r.price.toLocaleString('ru')} ₽</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    `;

    document.getElementById('product-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
    setupPhotoSwipe(images.length);

    // Обновляем URL без перезагрузки — чтобы можно было скопировать ссылку
    try {
      const url = new URL(window.location);
      url.searchParams.set('product', id);
      window.history.replaceState({}, '', url);
    } catch (e) {}
  }

  function switchProduct(id) {
    state.currentPhotoIndex = 0;
    openProduct(id);
    setTimeout(() => {
      const details = document.querySelector('.product-details');
      if (details) details.scrollTop = 0;
    }, 50);
  }

  function setupPhotoSwipe(total) {
    const track = document.getElementById('photo-track');
    if (!track || total < 2) return;
    let startX = 0, currentX = 0, dragging = false;

    track.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      dragging = true;
      track.style.transition = 'none';
    }, { passive: true });

    track.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      currentX = e.touches[0].clientX - startX;
      const offset = -state.currentPhotoIndex * track.offsetWidth + currentX;
      track.style.transform = `translateX(${offset}px)`;
    }, { passive: true });

    track.addEventListener('touchend', () => {
      dragging = false;
      track.style.transition = '';
      if (Math.abs(currentX) > 50) {
        if (currentX < 0 && state.currentPhotoIndex < total - 1) state.currentPhotoIndex++;
        else if (currentX > 0 && state.currentPhotoIndex > 0) state.currentPhotoIndex--;
      }
      photoGoTo(state.currentPhotoIndex);
      currentX = 0;
    });
  }

  function photoGoTo(index) {
    const track = document.getElementById('photo-track');
    if (!track) return;
    state.currentPhotoIndex = index;
    track.style.transform = `translateX(-${index * 100}%)`;
    document.querySelectorAll('.photo-dot').forEach((d, i) => {
      d.classList.toggle('on', i === index);
    });
  }

  function photoPrev() {
    const p = state.currentProduct;
    const images = p.images || (p.image ? [p.image] : []);
    if (state.currentPhotoIndex > 0) photoGoTo(state.currentPhotoIndex - 1);
    else photoGoTo(images.length - 1);
  }

  function photoNext() {
    const p = state.currentProduct;
    const images = p.images || (p.image ? [p.image] : []);
    if (state.currentPhotoIndex < images.length - 1) photoGoTo(state.currentPhotoIndex + 1);
    else photoGoTo(0);
  }

  function syncProductFav(id) {
    const isFav = state.favorites.has(id);
    const btn = document.getElementById('product-fav-btn');
    if (btn) btn.textContent = isFav ? '♥ Убрать из избранного' : '♡ Добавить в избранное';
  }

  function closeProduct() {
    document.getElementById('product-modal').classList.remove('active');
    document.body.style.overflow = '';
    // Убираем ?product=ID из URL
    try {
      const url = new URL(window.location);
      url.searchParams.delete('product');
      window.history.replaceState({}, '', url);
    } catch (e) {}
  }

  function selectSize(size) {
    state.selectedSize = size;
    document.querySelectorAll('#size-row .size-btn').forEach(btn => {
      btn.classList.toggle('on', btn.textContent === size);
    });
  }

  /* ==================== ДЕЙСТВИЕ (ОДНА КНОПКА) ==================== */
  function handleAction(type) {
    if (!state.user) {
      closeProduct();
      showToast('Войдите, чтобы продолжить');
      openAuth('login');
      return;
    }

    const content = document.getElementById('product-content');
    const p = state.currentProduct;
    const img = (p.images && p.images[0]) || p.image || '';

    const isBooking = type === 'booking';
    const title = isBooking ? 'Подтвердить бронь?' : 'Подтвердить заказ?';
    const subtitle = isBooking
      ? 'Мы свяжемся с вами для подтверждения брони'
      : 'Товар под заказ — свяжемся для уточнения сроков';
    const btnText = isBooking ? 'Забронировать' : 'Заказать';
    const btnClass = isBooking ? 'form-submit' : 'form-submit form-submit-gold';

    content.innerHTML = `
      <button class="modal-close" onclick="closeProduct()" style="position: absolute;">×</button>
      <div style="padding: 40px; text-align: center;">
        <div style="font-size: 56px; margin-bottom: 16px;">${isBooking ? '🛒' : '⏳'}</div>
        <div class="auth-title" style="font-size: 24px;">${title}</div>
        <div class="auth-sub">${subtitle}</div>

        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 24px; text-align: left;">
          <div style="display: flex; gap: 14px; margin-bottom: 14px;">
            <div style="width: 60px; height: 80px; border-radius: 10px; overflow: hidden; flex-shrink: 0; background: var(--surface-2);">
              <img src="${img}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none';">
            </div>
            <div style="flex: 1;">
              <div class="prod-brand" style="margin-bottom: 4px;">${p.brand}</div>
              <div style="font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 6px;">${p.name}</div>
              <div style="font-size: 12px; color: var(--text-3);">Размер: ${state.selectedSize}</div>
              ${!isBooking ? `<div style="font-size: 11px; color: var(--orange); margin-top: 6px; font-weight: 600;">⏳ Доставка под заказ 5–7 дней</div>` : ''}
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; padding-top: 14px; border-top: 1px solid var(--border);">
            <span style="font-size: 13px; color: var(--text-2);">Итого</span>
            <span style="font-size: 20px; font-weight: 800; color: #fff;">${p.price.toLocaleString('ru')} ₽</span>
          </div>
        </div>

        <button class="${btnClass}" onclick="confirmAction('${type}')" id="confirm-btn">${btnText}</button>
        <div class="form-skip"><button onclick="closeProduct()">Отмена</button></div>
      </div>
    `;
  }

  async function confirmAction(type) {
    const btn = document.getElementById('confirm-btn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Отправляем...';

    const product = state.currentProduct;
    const size = state.selectedSize;

    try {
      await createOrder(product, size, type);
      const emailResult = await sendEmail(product, size, type);

      if (emailResult.success) {
        console.log(`✓ Заказ и письмо (${type}) отправлены`);
      } else {
        console.log('⚠️ Заказ сохранён, письмо не отправлено');
      }

      closeProduct();
      showToast(type === 'booking' ? '✓ Бронь отправлена!' : '✓ Заказ отправлен!');
      setTimeout(() => openProfile(), 800);
    } catch (e) {
      console.error('Order error:', e);
      showToast('Ошибка: ' + (e.message || 'не удалось отправить'));
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  /* ==================== ИЗБРАННОЕ ==================== */
  function toggleFav(id, size) {
    const wasFav = state.favorites.has(id);
    if (wasFav) {
      state.favorites.delete(id);
      showToast('Удалено из избранного');
    } else {
      state.favorites.set(id, size || null);
      showToast('Добавлено в избранное ♥');
    }
    document.querySelectorAll(`[data-fav-id="${id}"]`).forEach(btn => {
      btn.classList.toggle('on', !wasFav);
      btn.textContent = !wasFav ? '♥' : '♡';
    });
  }

  function openFavorites() {
    renderFavorites();
    document.getElementById('fav-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeFavorites() {
    document.getElementById('fav-modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function renderFavorites() {
    const el = document.getElementById('fav-content');
    const favItems = products.filter(p => state.favorites.has(p.id));

    if (favItems.length === 0) {
      el.innerHTML = `
        <div class="auth-title">Избранное</div>
        <div class="auth-sub">0 товаров</div>
        <div class="empty-state">
          <div class="empty-icon">♡</div>
          <div class="empty-title">Пока пусто</div>
          <div class="empty-text">Сохраняйте товары, чтобы вернуться к ним позже</div>
        </div>
      `;
      return;
    }

    el.innerHTML = `
      <div class="auth-title">Избранное</div>
      <div class="auth-sub">${favItems.length} ${plural(favItems.length, 'товар', 'товара', 'товаров')}</div>
      <div class="search-results">
        ${favItems.map(p => {
          const img = (p.images && p.images[0]) || p.image || '';
          const savedSize = state.favorites.get(p.id);
          const preorderMark = !p.in_stock ? `<span style="color: var(--orange); font-size: 11px; font-weight: 600;">⏳ Под заказ</span>` : '';
          return `
            <div class="search-result-item" onclick="closeFavorites(); openProduct(${p.id});">
              <div class="search-result-img">
                <img src="${img}" draggable="false" onerror="this.style.display='none';">
              </div>
              <div class="search-result-info">
                <div class="search-result-name">${p.name}</div>
                ${savedSize ? `<div style="font-size: 12px; color: var(--text-2); margin-bottom: 6px;">Размер: ${savedSize}</div>` : ''}
                ${preorderMark ? `<div style="margin-bottom: 6px;">${preorderMark}</div>` : ''}
                <div class="search-result-price">${p.price.toLocaleString('ru')} ₽</div>
              </div>
              <button onclick="event.stopPropagation(); toggleFav(${p.id}); renderFavorites();" style="background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 8px; font-family: inherit;">♥</button>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  /* ==================== ПОИСК ==================== */
  function openSearch() {
    document.getElementById('search-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
    setTimeout(() => {
      const input = document.getElementById('search-input');
      if (input) { input.value = ''; input.focus(); }
    }, 300);
    performSearch('');
  }

  function closeSearch() {
    document.getElementById('search-modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function quickSearch(q) {
    document.getElementById('search-input').value = q;
    performSearch(q);
  }

  function performSearch(query) {
    const q = query.trim().toLowerCase();
    const resultsEl = document.getElementById('search-results');
    const defaultEl = document.getElementById('search-default');

    if (!q) {
      defaultEl.style.display = 'block';
      resultsEl.innerHTML = '';
      return;
    }
    defaultEl.style.display = 'none';

    const found = products.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.brand || '').toLowerCase().includes(q) ||
      (p.category || '').toLowerCase().includes(q) ||
      (p.description || '').toLowerCase().includes(q)
    );

    if (found.length === 0) {
      resultsEl.innerHTML = `<div class="empty-state" style="padding: 40px 20px;"><div class="empty-icon">🔍</div><div class="empty-title">Ничего не найдено</div><div class="empty-text">Попробуйте другой запрос</div></div>`;
      return;
    }

    resultsEl.innerHTML = found.map(p => {
      const img = (p.images && p.images[0]) || p.image || '';
      const preorderMark = !p.in_stock ? `<span style="color: var(--orange); font-size: 11px; font-weight: 600;">⏳ Под заказ</span>` : '';
      return `
        <div class="search-result-item" onclick="closeSearch(); openProduct(${p.id});">
          <div class="search-result-img">
            <img src="${img}" draggable="false" onerror="this.style.display='none';">
          </div>
          <div class="search-result-info">
            <div class="search-result-name">${p.name}</div>
            ${preorderMark ? `<div style="margin-bottom: 6px;">${preorderMark}</div>` : ''}
            <div class="search-result-price">${p.price.toLocaleString('ru')} ₽</div>
          </div>
        </div>
      `;
    }).join('');
  }

  /* ==================== ПРОФИЛЬ ==================== */
  function openProfile() {
    renderProfile();
    document.getElementById('profile-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeProfile() {
    document.getElementById('profile-modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function renderProfile() {
    const el = document.getElementById('profile-content');

    if (!state.user) {
      el.innerHTML = `
        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 56px; color: var(--text-3); margin-bottom: 20px;">👤</div>
          <div class="auth-title">Войдите в аккаунт</div>
          <div class="auth-sub" style="margin-bottom: 28px;">Чтобы бронировать товары и видеть историю заказов</div>
          <button class="form-submit" onclick="closeProfile(); openAuth('login');" style="margin-bottom: 10px;">Войти</button>
          <button class="form-submit" onclick="closeProfile(); openAuth('signup');" style="background: transparent; border: 1.5px solid var(--border); color: #fff;">Создать аккаунт</button>
        </div>
      `;
      return;
    }

    const phone = state.user.user_metadata?.phone || 'Пользователь';
    const initial = (phone.replace(/[^0-9]/g, '') || 'U').slice(-2, -1) || 'U';

    const ordersHtml = state.orders.length === 0
      ? `<div class="empty-state"><div class="empty-icon">📦</div><div class="empty-title">Заказов нет</div></div>`
      : state.orders.map(o => {
          const statusText = { new: 'Новый', confirmed: 'Подтверждён', cancelled: 'Отменён' }[o.status] || 'Новый';
          const statusClass = o.status || 'new';
          const canCancel = statusClass === 'new';
          return `
            <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; gap: 12px; margin-bottom: 10px;">
              <div style="width: 60px; height: 80px; background: var(--surface-2); border-radius: 10px; overflow: hidden; flex-shrink: 0;">
                <img src="${o.product_image}" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none';">
              </div>
              <div style="flex: 1;">
                <div style="font-size: 13px; font-weight: 600; color: #fff; margin-bottom: 4px; line-height: 1.3;">${o.product_name}</div>
                <div style="font-size: 11px; color: var(--text-3); margin-bottom: 6px;">Размер: ${o.product_size} · ${new Date(o.created_at).toLocaleDateString('ru')}</div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                  <span style="font-size: 14px; font-weight: 700; color: #fff;">${o.product_price.toLocaleString('ru')} ₽</span>
                  <span style="font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; background: ${statusClass === 'new' ? 'rgba(212,176,106,0.15)' : statusClass === 'confirmed' ? 'rgba(78,205,196,0.15)' : 'rgba(255,77,109,0.15)'}; color: ${statusClass === 'new' ? 'var(--gold)' : statusClass === 'confirmed' ? 'var(--green)' : 'var(--red)'};">${statusText}</span>
                </div>
                ${canCancel ? `<button class="order-cancel-btn" onclick="cancelOrder('${o.id}')">Отменить заказ</button>` : ''}
              </div>
            </div>
          `;
        }).join('');

    el.innerHTML = `
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="width: 70px; height: 70px; background: var(--surface); border: 1.5px solid var(--gold); border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--gold); font-family: Georgia, serif; font-style: italic;">${initial}</div>
        <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px;">${phone}</div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 24px;">
        <div style="background: var(--surface); padding: 14px 8px; text-align: center;">
          <div style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 3px;">${state.orders.length}</div>
          <div style="font-size: 10px; color: var(--text-2);">Заказов</div>
        </div>
        <div style="background: var(--surface); padding: 14px 8px; text-align: center;">
          <div style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 3px;">${state.favorites.size}</div>
          <div style="font-size: 10px; color: var(--text-2);">В избранном</div>
        </div>
        <div style="background: var(--surface); padding: 14px 8px; text-align: center;">
          <div style="font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 3px;">0</div>
          <div style="font-size: 10px; color: var(--text-2);">Бонусов</div>
        </div>
      </div>

      <div style="font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-3); font-weight: 700; padding: 4px 0 12px;">Мои заказы</div>
      ${ordersHtml}

      <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border);">
        <button class="form-submit" onclick="signOut()" style="background: transparent; border: 1.5px solid var(--border); color: var(--red);">Выйти из аккаунта</button>
      </div>
    `;
  }

  /* ==================== АВТОРИЗАЦИЯ ==================== */
  function openAuth(mode = 'login') {
    state.authMode = mode;
    renderAuthForm();
    document.getElementById('auth-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAuth() {
    document.getElementById('auth-modal').classList.remove('active');
    document.body.style.overflow = '';
  }

  function renderAuthForm() {
    const content = document.getElementById('auth-content');
    const isLogin = state.authMode === 'login';

    content.innerHTML = `
      <div class="auth-title">${isLogin ? 'Вход' : 'Регистрация'}</div>
      <div class="auth-sub">${isLogin ? 'Войдите, чтобы бронировать товары' : 'Создайте аккаунт за 30 секунд'}</div>

      <div class="form-error" id="auth-error"></div>

      <div class="form-group">
        <label class="form-label">Номер телефона</label>
        <input type="tel" class="form-input" id="auth-phone" placeholder="+7 999 123-45-67" autocomplete="tel">
      </div>

      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input type="password" class="form-input" id="auth-password" placeholder="Минимум 6 символов" autocomplete="${isLogin ? 'current-password' : 'new-password'}">
      </div>

      <button class="form-submit" onclick="submitAuth()" id="auth-submit">${isLogin ? 'Войти' : 'Создать аккаунт'}</button>

      <div class="form-switch">
        ${isLogin ? 'Нет аккаунта?' : 'Уже есть аккаунт?'}
        <button onclick="switchAuthMode()">${isLogin ? 'Создать' : 'Войти'}</button>
      </div>

      <div class="form-skip">
        <button onclick="closeAuth()">Продолжить без входа</button>
      </div>
    `;
  }

  function switchAuthMode() {
    state.authMode = state.authMode === 'login' ? 'signup' : 'login';
    renderAuthForm();
  }

  async function submitAuth() {
    const phone = document.getElementById('auth-phone').value.trim();
    const password = document.getElementById('auth-password').value;
    const errorEl = document.getElementById('auth-error');
    const btn = document.getElementById('auth-submit');

    errorEl.classList.remove('show');

    if (!phone || phone.replace(/[^0-9]/g, '').length < 10) {
      errorEl.textContent = 'Введите корректный номер телефона';
      errorEl.classList.add('show');
      return;
    }

    if (!password || password.length < 6) {
      errorEl.textContent = 'Пароль минимум 6 символов';
      errorEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = state.authMode === 'login' ? 'Входим...' : 'Создаём...';

    try {
      if (state.authMode === 'login') {
        await signIn(phone, password);
        showToast('✓ Вы вошли');
      } else {
        await signUp(phone, password);
        showToast('✓ Аккаунт создан');
      }

      await checkAuth();
      updateUserUI();
      closeAuth();
      setTimeout(() => openProfile(), 400);
    } catch (e) {
      console.error('Auth error:', e);
      let msg = 'Ошибка. Попробуйте ещё раз';
      if (e.message?.toLowerCase().includes('invalid login')) msg = 'Неверный номер или пароль';
      if (e.message?.toLowerCase().includes('already registered')) msg = 'Этот номер уже зарегистрирован';
      if (e.message?.toLowerCase().includes('email not confirmed')) msg = 'Подтвердите email в настройках Supabase';
      if (e.message?.toLowerCase().includes('password')) msg = 'Пароль слишком короткий';
      errorEl.textContent = msg;
      errorEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = state.authMode === 'login' ? 'Войти' : 'Создать аккаунт';
    }
  }

  function updateUserUI() {
    const btn = document.getElementById('header-user-btn');
    if (!btn) return;
    if (state.user) {
      const phone = state.user.user_metadata?.phone || '';
      const initial = (phone.replace(/[^0-9]/g, '') || 'U').slice(-2, -1) || 'U';
      btn.textContent = initial.toUpperCase();
      btn.classList.add('logged-in');
    } else {
      btn.textContent = '👤';
      btn.classList.remove('logged-in');
    }
  }

  /* ==================== НАВИГАЦИЯ ==================== */
  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function scrollToCatalog() {
    const el = document.getElementById('catalog-section');
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }

  /* ==================== ВСПОМОГАТЕЛЬНЫЕ ==================== */
  function plural(n, one, few, many) {
    const mod10 = n % 10;
    const mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
    return many;
  }

  let toastTimer;
  function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ==================== ИНИЦИАЛИЗАЦИЯ ==================== */
  async function init() {
    document.querySelectorAll('.filter').forEach(f => {
      f.addEventListener('click', () => applyFilter(f.dataset.cat));
    });

    document.querySelectorAll('.modal').forEach(m => {
      m.addEventListener('click', (e) => {
        if (e.target === m) {
          m.classList.remove('active');
          document.body.style.overflow = '';
        }
      });
    });

    const searchInput = document.getElementById('search-input');
    if (searchInput) searchInput.addEventListener('input', (e) => performSearch(e.target.value));

    document.addEventListener('dragstart', (e) => {
      if (e.target.tagName === 'IMG') e.preventDefault();
    });

    await runLoader();
    await loadProducts();
    await checkAuth();

    renderGrid(false);
    updateUserUI();

    const loader = document.getElementById('loader');
    loader.classList.add('hidden');
    setTimeout(() => loader.remove(), 400);

    // Автооткрытие товара по ссылке ?product=ID
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('product');
    if (productId) {
      const id = parseInt(productId);
      const found = products.find(p => p.id === id);
      if (found) {
        setTimeout(() => openProduct(id), 500);
      }
    }
  }

  init();
</script>

</body>
</html>
